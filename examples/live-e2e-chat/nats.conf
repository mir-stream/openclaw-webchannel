# Demo NATS server — open auth + WebSocket (so a browser can dial it directly).
#
# This intentionally has NO operator/account/JWT auth: the demo's focus is the
# END-TO-END ENCRYPTED PAYLOAD, not transport auth. The full JWT/account trust
# chain is exercised separately (packages/saas + the AC6 device-flow E2E test).
#
# Start with:  nats-server -c nats.conf

port: 14222         # TCP (not used by the browser; handy for nats CLI poking)

websocket {
  port: 8087        # browsers dial ws://127.0.0.1:8087
  no_tls: true
}
