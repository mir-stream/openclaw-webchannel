<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebChannel — live E2E chat over NATS</title>
    <style>
      :root { color-scheme: light dark; --bg:#0f1115; --panel:#171a21; --line:#262b36; --me:#2563eb; --agent:#334155; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
      * { box-sizing: border-box; }
      body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#e5e7eb; }
      header { padding:16px 20px; border-bottom:1px solid var(--line); }
      h1 { margin:0; font-size:18px; }
      .status { margin-top:6px; font-size:13px; padding:2px 8px; border-radius:6px; display:inline-block; background:#222; }
      .status.ok{ background:rgba(22,163,74,.18); color:#4ade80;} .status.warn{ background:rgba(217,119,6,.18); color:#fbbf24;} .status.err{ background:rgba(220,38,38,.18); color:#f87171;}
      main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px 20px; height:calc(100vh - 70px); }
      @media (max-width:860px){ main{ grid-template-columns:1fr; height:auto; } }
      .chat { display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
      .log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; min-height:300px; }
      .bubble { max-width:80%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
      .bubble.you { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:3px; }
      .bubble.agent { align-self:flex-start; background:var(--agent); border-bottom-left-radius:3px; }
      .bubble.sys { align-self:center; background:transparent; color:#94a3b8; font-size:12px; font-style:italic; }
      form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
      input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0d0f14; color:#e5e7eb; }
      button { padding:10px 16px; border:0; border-radius:8px; background:var(--me); color:#fff; font-weight:600; cursor:pointer; }
      button:disabled { opacity:.5; cursor:not-allowed; }
      .wire { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
      .wire h2 { font-size:13px; margin:10px 0 4px; color:#cbd5e1; } .wire h2:first-child{ margin-top:0; }
      .hint { font-size:12px; color:#94a3b8; margin:0 0 8px; }
      pre { background:#0d0f14; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font:12px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-all; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
