<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebChannel — Live Chat Demo</title>
  <!-- demo-server.mjs injects globalThis.__DEMO_CONFIG__ here, BEFORE the bundle. -->
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --accent: #4f8cff;
      --agent: #232834;
      --ok: #3fb950;
      --err: #f85149;
      --warn: #d29922;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
    }
    header { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 12px; }
    .status {
      margin: 10px 0;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--warn); flex: none;
    }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: var(--agent);
      border-bottom-left-radius: 4px;
    }
    .msg.err {
      align-self: center;
      background: transparent;
      color: var(--err);
      font-size: 13px;
      border: 1px solid var(--err);
      max-width: 92%;
    }
    .msg.note {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    form {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    #input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 13px;
      font: inherit;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #input:disabled, #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>WebChannel — Live Chat Demo</h1>
      <div class="sub">Real browser client · NKEY-auth NATS · PoP register · E2E encrypted · echo agent</div>
    </header>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">starting…</span>
    </div>

    <div id="log"></div>

    <form id="form">
      <input id="input" type="text" placeholder="Connecting…" autocomplete="off" disabled />
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </div>

  <!-- The bundle (IIFE) defines globalThis.WebDemo.runDemo. -->
  <script src="/demo-bundle.js"></script>
  <script>
    (function () {
      var logEl = document.getElementById("log");
      var inputEl = document.getElementById("input");
      var sendBtn = document.getElementById("send");
      var formEl = document.getElementById("form");
      var dotEl = document.getElementById("dot");
      var statusEl = document.getElementById("statusText");

      var controller = null;
      var ready = false;

      function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }

      function append(kind, text) {
        var d = document.createElement("div");
        d.className = "msg " + kind;
        d.textContent = text;
        logEl.appendChild(d);
        scrollDown();
      }

      function setStatus(text, state) {
        statusEl.textContent = text;
        dotEl.className = "dot" + (state ? " " + state : "");
      }

      function setReady(isReady) {
        ready = isReady;
        inputEl.disabled = !isReady;
        sendBtn.disabled = !isReady;
        inputEl.placeholder = isReady ? "Type a message…" : "Connecting…";
        if (isReady) inputEl.focus();
      }

      var config = (typeof globalThis !== "undefined" && globalThis.__DEMO_CONFIG__) || {};

      if (!globalThis.WebDemo || typeof globalThis.WebDemo.runDemo !== "function") {
        setStatus("bundle failed to load", "err");
        append("err", "Demo bundle (/demo-bundle.js) did not load or is missing runDemo.");
        return;
      }

      var callbacks = {
        onReply: function (text) { append("agent", text); },
        onError: function (err) {
          setStatus("error", "err");
          append("err", (err && err.message) ? err.message : String(err));
          setReady(false);
        },
        onStatus: function (status) {
          if (status === "connected" || status === "ready") {
            setStatus("connected", "ok");
            if (!ready) {
              setReady(true);
              append("note", "Connected. Say hello — the echo agent will reply.");
            }
          } else if (status === "connecting") {
            setStatus("connecting…", "");
          } else {
            // generating keys, fetching creds, etc.
            setStatus(status + "…", "");
          }
        },
      };

      formEl.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = inputEl.value.trim();
        if (!text || !ready || !controller) return;
        append("user", text);
        try {
          controller.send(text);
        } catch (err) {
          append("err", "send failed: " + ((err && err.message) || String(err)));
        }
        inputEl.value = "";
        inputEl.focus();
      });

      setStatus("starting…", "");
      globalThis.WebDemo.runDemo(config, callbacks)
        .then(function (ctrl) { controller = ctrl; })
        .catch(function (err) {
          setStatus("failed to start", "err");
          append("err", "Setup failed: " + ((err && err.message) || String(err)));
        });
    })();
  </script>
</body>
</html>
