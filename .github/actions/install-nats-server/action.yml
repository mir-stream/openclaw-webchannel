name: Install nats-server
description: Provision the pinned nats-server binary, with a cross-workflow cache.

inputs:
  version:
    description: nats-server release tag to provision (e.g. v2.14.0).
    # SINGLE SOURCE OF TRUTH for the pinned nats-server version: bump it HERE and
    # every workflow that uses this action follows. Never "latest" — a floating
    # server version silently changes what the real-server suites test against.
    default: "v2.14.0"

# Exported so a caller can audit the primary restore and the adjacent
# lookup-only probe. `actions/cache@v4` exposes only `cache-hit`; the cache key
# and the probe's did-it-run signal have to be handed out explicitly here.
#
# The key template is spelled ONCE, in the "Resolve install dir and cache key"
# step below, which writes it to $GITHUB_OUTPUT; the `cache-key` output and both
# cache steps' `key:` fields read it back from there. It used to be written out
# twice, and nothing could have caught a drift between the copies. A
# `cache-key` that drifted from the key actually saved makes the poisoned-cache
# guard check a key nothing ever writes — green, and meaningless, which is the
# precise failure that guard exists to end.
outputs:
  cache-hit:
    description: Whether the pinned nats-server binary was restored from cache.
    value: ${{ steps.cache-nats.outputs.cache-hit }}
  cache-key:
    description: The cache key this action restores and saves under.
    value: ${{ steps.resolve.outputs.cache-key }}
  probe-hit:
    description: Whether the lookup-only probe found the cache after a primary miss.
    value: ${{ steps.probe-nats.outputs.cache-hit }}
  probe-key:
    description: The key recorded by the probe, proving whether the probe ran.
    value: ${{ steps.probe-nats.outputs.cache-primary-key }}

# NO SUDO ANYWHERE IN THIS ACTION.
#
# Installing under $RUNNER_TOOL_CACHE and exporting it via $GITHUB_PATH needs no
# elevation and works identically on every runner. Do not reintroduce sudo here:
# it buys nothing, and it puts a root requirement on the lane that holds the
# publish credentials.
#
# (History, so the rule is not re-litigated: this installed to /usr/local/bin via
# `sudo mv` back when every lane was self-hosted with passwordless sudo. The
# publish lane did not have it, and both halves broke there — `actions/cache`
# could not restore into /usr/local/bin, and the download fallback died on
# `sudo: a password is required`. All lanes are GitHub-hosted now, which would
# tolerate sudo again; the rule stays because it is simply the portable one.)
runs:
  using: composite
  steps:
    - name: Resolve install dir and cache key
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        # RUNNER_TOOL_CACHE is always writable by the runner user; fall back to
        # HOME on the rare runner that leaves it unset. On hosted runners the
        # directory is ephemeral, so `actions/cache` below — not the location —
        # is what makes this survive between runs.
        DIR="${RUNNER_TOOL_CACHE:-$HOME/.cache}/nats-server/${{ inputs.version }}"
        mkdir -p "$DIR"
        # NATS_SERVER_DIR is read back by both cache steps below. The probe must
        # reproduce this cache's VERSION, which hashes the `path:` string.
        # Renaming or dropping this export would leave both steps answering
        # about a different path.
        echo "NATS_SERVER_DIR=$DIR" >> "$GITHUB_ENV"
        echo "$DIR" >> "$GITHUB_PATH"
        # THE ONLY PLACE THE CACHE KEY TEMPLATE IS WRITTEN. BOTH cache steps
        # below are keyed on this output and so is this action's exported
        # `cache-key` — which is what makes the probe reproduce the primary's
        # (key, version) pair rather than merely resemble it,
        # so the key the caller's poisoned-cache guard checks and the key this
        # action actually saves under cannot come apart. Bumped (-toolcache)
        # because the old key's entries were saved with an absolute
        # /usr/local/bin path and restore into the new location as a stray
        # nested tree rather than a usable binary. Editing this string strands
        # the live entry; it is not a formatting choice.
        echo "cache-key=nats-server-${{ inputs.version }}-linux-amd64-toolcache" >> "$GITHUB_OUTPUT"

    - name: Cache nats-server binary
      id: cache-nats
      uses: actions/cache@v4
      with:
        path: ${{ env.NATS_SERVER_DIR }}
        key: ${{ steps.resolve.outputs.cache-key }}

    - name: Probe the nats-server cache at this run's version
      id: probe-nats
      if: steps.cache-nats.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.NATS_SERVER_DIR }}
        key: ${{ steps.resolve.outputs.cache-key }}
        lookup-only: true

    - name: Install nats-server ${{ inputs.version }}
      if: steps.cache-nats.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        TARBALL="nats-server-${VERSION}-linux-amd64.tar.gz"
        URL="https://github.com/nats-io/nats-server/releases/download/${VERSION}/${TARBALL}"
        WORK="$(mktemp -d)"
        curl -fsSL "${URL}" -o "${WORK}/${TARBALL}"
        tar -xzf "${WORK}/${TARBALL}" -C "${WORK}"
        mv "${WORK}/nats-server-${VERSION}-linux-amd64/nats-server" "${NATS_SERVER_DIR}/nats-server"
        chmod +x "${NATS_SERVER_DIR}/nats-server"
        rm -rf "${WORK}"

    - name: Verify nats-server is on PATH
      shell: bash
      run: |
        set -euo pipefail
        which nats-server
        nats-server --version
