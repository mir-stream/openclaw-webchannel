################################################################################
# publish.yml — Publish all release artifacts from ONE v* tag:
#   1. @mir-stream/webchannel-client → public npm registry (registry.npmjs.org)
#   2. @mir-stream/webchannel-saas   → public npm registry (registry.npmjs.org)
#   3. openclaw-webchannel plugin    → public npm registry (registry.npmjs.org).
#                                      This is the zero-auth remote-install path:
#                                      `openclaw plugins install openclaw-webchannel@<v>`.
#   4. openclaw-webchannel plugin    → ClawHub registry (code-plugin)
#
# ALL THREE npm artifacts go to the PUBLIC registry via OIDC trusted publishing
# with `--provenance` — no NPM_TOKEN, no PAT, no long-lived credential anywhere.
# The two scoped packages moved off GitHub Packages in 0.6.1: GH Packages
# requires an authenticated `read:packages` PAT for EVERY consumer read, even of
# a public package, and that auth requirement was the only thing forcing
# downstreams to vendor these packages instead of installing them. The repo is
# public and all three packages are MIT, so there is nothing left to gate.
#
# Trigger: push a tag like v0.1.0 (all three share ONE version). A
# workflow_dispatch run never publishes anything, from any ref; it builds,
# tests, and runs both lockstep gates, which is what makes it useful. Only a v*
# tag push publishes. The plugin leg (publish-plugin, gated on the npm leg)
# publishes to ClawHub.
#
# ONE-TIME BOOTSTRAP (per package name): npm attaches a Trusted Publisher to an
# EXISTING package, so the very first publish of a brand-new name cannot come
# from OIDC — an org owner publishes it manually once, then configures the
# trusted publisher. Full procedure in docs/PUBLISHING.md.
#
# ClawHub auth is OIDC-first with a stored-token FALLBACK. The clawhub CLI's
# resolvePackagePublishToken tries an OIDC mint first, then falls back to the
# stored config token on mint failure. The fallback is what this workflow is
# still wired for — a `CLAWHUB_TOKEN` repo secret written to a runner-temp config
# file — because trusted publishing could not be registered while the repo was
# private (ClawHub's server-side GitHub lookup 404s on a private repo). That
# blocker is gone now that the repo is public: register once with `clawhub
# package trusted-publisher set` and OIDC takes over with ZERO workflow change
# (`id-token: write` is already granted) and the secret can be deleted. The leg
# is provisionally disabled regardless — see its own comment block and
# docs/PUBLISHING.md.
#
# 3-way version lockstep is enforced hard: tag == plugin == client == saas, so
# the plugin can never drift behind the npm packages again. The check runs in
# BOTH jobs — in the npm leg (publish) it runs BEFORE anything is published, so a
# mismatch aborts the release with nothing shipped and the tag unburned; the copy
# in publish-plugin stays as defense-in-depth.
#
# Consumers need nothing: `npm install @mir-stream/webchannel-saas@<v>` works
# with no .npmrc and no token, and `npm audit signatures` verifies the
# provenance attestation back to the workflow run that built it. See
# docs/PUBLISHING.md.
################################################################################

name: Publish Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Every v* tag push shares one group so different releases cannot interleave
# writes to the same npm `latest` tags. Every dispatch stays keyed per ref: it
# publishes nothing, so it must never queue behind or evict a release.
# Cancellation stays off:
# cancelling a half-finished publish is strictly worse than queueing behind it.
# GitHub retains only one pending run per group; if a third release arrives while
# one is running and one is pending, GitHub cancels the pending run. That is loud
# and recoverable with `gh run rerun <RUN_ID>`, but it is not silent serialization.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'npm-release' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest  # 공개 저장소 전환(자체 호스팅 러너 폐지)
    permissions:
      contents: read
      # OIDC trusted publishing: npm exchanges this id-token for a short-lived
      # publish credential — no NPM_TOKEN secret and no GITHUB_TOKEN write scope.
      # (`packages: write` is gone with the GitHub Packages leg it existed for.)
      id-token: write
    steps:
      # ── 컷오버 조상 가드 ──
      # 구 커밋 재태그(전환 이전 세계의 파일·크레덴셜 전제)가 크레덴셜에 닿기 전에 차단한다.
      # 체크아웃 불필요: API compare 한 방. GITHUB_REF_NAME(태그명) 비교라 annotated 태그 역참조 문제 없음.
      # 후속 3잡은 needs: publish 라 이 가드 하나로 전부 차단된다.
      # 알려진 잔여 구간: 이 SHA 이후·호스티드 러너 전환 이전 커밋을 재태그하면 가드는 통과하지만
      # 워크플로가 그 시점 파일(`runs-on: deploy`)로 돌아 존재하지 않는 라벨에 영원히 큐잉된다.
      # 그 태그를 실제로 다시 팔 일이 생기면 SHA 를 전환 커밋으로 올려 실패를 시끄럽게 만들 것.
      - name: cutover ancestry guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_CUTOVER_COMMIT: 67b61b91c846482045e260d532b207b8bf869b22
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RUNNER_CUTOVER_COMMIT}...${GITHUB_REF_NAME}" --jq .status)
          case "$status" in
            ahead|identical) echo "ancestry OK ($status)" ;;
            *) echo "::error::ref ${GITHUB_REF_NAME} is not a descendant of cutover commit (status=$status) — old-world retag suspected, aborting before any credential use"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # No `scope:` — setup-node writes a bare `registry=` line only when scope is
      # absent; with a scope it writes `@scope:registry=` INSTEAD and leaves the
      # default registry alone. We want the default pointed at npmjs.org (same as
      # the plugin leg), which is what both the scoped `npm publish` and the
      # `npm view` idempotency probe then resolve against.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Pin to the 11.x line
      # rather than `npm@latest`: this step runs before `npm ci` and `npx
      # vitest`, so whatever it installs governs the whole job's tooling, and
      # this repo has already been bitten once by an npm major silently changing
      # a contract (npm 12 reshaped `npm pack --json` and broke the ClawHub CLI —
      # see CLAWHUB_NPM_PIN below). >= 11.5.1 is the actual stated requirement;
      # take the newest 11.x that satisfies it and nothing beyond.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g "npm@^11.5.1"

      # Fail-fast copy of the lockstep check. It runs BEFORE any npm artifact is
      # built or published, so a version mismatch aborts the tag with nothing
      # shipped and the tag unburned — recover by deleting the tag, fixing the
      # versions, and re-pushing. The copy in publish-plugin stays as
      # defense-in-depth and is the one that exports VERSION for later steps.
      #
      # The check is in TWO halves because only one of them needs a tag:
      #   - plugin == client == saas is comparable on ANY ref, so it always runs.
      #     It used to be skipped wholesale on non-tag refs, which removed the
      #     gate precisely on the path (workflow_dispatch from a branch) where
      #     nothing else was checking the versions at all.
      #   - == tag needs a tag, so that half runs only on a tag ref.
      # A non-tag run is not a release: the publish step below refuses to ship
      # from one, so a drifted branch fails here loudly rather than shipping.
      - name: Enforce 3-way version lockstep (tag == plugin == client == saas)
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(node -p "require('./packages/plugin/package.json').version")"
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          SAAS_VERSION="$(node -p "require('./packages/saas/package.json').version")"
          echo "ref=${GITHUB_REF} plugin=${PLUGIN_VERSION} client=${CLIENT_VERSION} saas=${SAAS_VERSION}"
          if [ "$CLIENT_VERSION" != "$PLUGIN_VERSION" ] \
            || [ "$SAAS_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version lockstep violation — plugin/client/saas must all match. Bump all three together."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              echo "tag=${TAG_VERSION}"
              if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
                echo "::error::Version lockstep violation — tag v${TAG_VERSION} must equal plugin/client/saas. Bump all three to match the tag before releasing."
                exit 1
              fi
              ;;
            *)
              echo "non-tag ref — 3-way equality enforced, tag comparison skipped (this run cannot publish)."
              ;;
          esac

      # saas real-server suites HARD FAIL (not skip) in CI when the nats-server
      # binary is missing — the pinned version lives in the composite action.
      - name: Install nats-server (pinned, cached)
        uses: ./.github/actions/install-nats-server

      - name: Install
        run: npm ci

      # Root cross-package lockstep gate: a v* tag cut from a commit that bypassed
      # the PR gate could ship diverged client/plugin WEBCHANNEL_PROTOCOL_VERSION
      # constants (per-package `npm test -w` never imports both in one process).
      # Runs BEFORE any publish step in this job; the two plugin jobs `needs:
      # publish`, so this one gate also blocks their npm/ClawHub publishes — a
      # one-sided constant bump must not reach npm.
      - name: Enforce client↔plugin protocol-version lockstep
        run: npx vitest run e2e/protocol-version-lockstep.test.ts

      - name: Build
        run: npm run build -w packages/client -w packages/saas

      - name: Unit tests (client + saas)
        run: |
          npm test -w packages/client
          npm test -w packages/saas
        env:
          CI: "true"

      # Per-package idempotency guard. Preserve first-release behaviour by keying
      # the existence probe off stdout: `npm view` exit semantics for a missing
      # version/package differ across npm majors, so only an exact version match
      # enters the skip path. Anything else (empty, E404, garbage) publishes, and
      # a real duplicate still 409s loudly. A version match alone is NOT trusted:
      # the registry must also report provenance and a gitHead matching this run's
      # commit, or the step fails instead of accepting an immutable tarball of
      # unknown origin. This makes "Re-run failed jobs" safe after a partial npm
      # publish (client shipped, saas flaked). On a full re-run, already-shipped
      # publish legs are verified no-ops and skip green. End-to-end green also
      # requires all three `latest` tags to equal the re-run tag's version, so a
      # superseded tag ends red at `verify-dist-tags` by design; never move
      # `latest` backward to fix it. Each check uses the package.json's own version
      # (NOT the tag); lockstep guarantees package.json == tag on the tag-push path.
      # The `npm view` probes need no auth now that the target is the public registry.
      #
      # TAG-PUSH GUARD — the invariant is: ONLY a v* tag push publishes. A
      # workflow_dispatch run never publishes anything, even from a v* tag ref.
      # The ref check blocks branch builds from burning an immutable public-npm
      # version; the event check prevents a tag-ref dispatch from running only
      # this client/saas leg while the push-only plugin and verifier jobs skip.
      # The guard is on this step rather than on the job so that every dispatch
      # still checks out, installs, runs both lockstep gates, builds and tests —
      # it just cannot ship. Recover a flaked release by re-running the ORIGINAL
      # tag-push run, which preserves its push event and tag ref for every job:
      #   gh run rerun <RUN_ID>          # or: gh run list --workflow publish.yml
      # The idempotency checks make already-shipped artifacts verified no-ops.
      #
      # No NODE_AUTH_TOKEN: with a configured Trusted Publisher and npm >=
      # 11.5.1, `npm publish` performs the OIDC exchange itself. `--access
      # public` is redundant with each package's publishConfig.access but stated
      # anyway, because scoped packages default to RESTRICTED and a silent
      # private publish is the expensive failure here. `--provenance` needs the
      # public repo (true since 2026-08-19), `id-token: write` (granted on this
      # job), and a `repository` field in each manifest (both have one); if
      # attestation generation fails, npm CANCELS the publish rather than
      # shipping unattested, so a failure here ships nothing and the tag can be
      # deleted and re-pushed.
      - name: Publish to public npm (OIDC, idempotent)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for PKG in client saas; do
            NAME="$(node -p "require('./packages/${PKG}/package.json').name")"
            WANT="$(node -p "require('./packages/${PKG}/package.json').version")"
            GOT="$(npm view "${NAME}@${WANT}" version 2>/dev/null || true)"
            if [ "$GOT" = "$WANT" ]; then
              PUBLISHED_GIT_HEAD="$(npm view "${NAME}@${WANT}" gitHead 2>/dev/null || true)"
              ATTESTATIONS="$(npm view "${NAME}@${WANT}" dist.attestations 2>/dev/null || true)"
              # GITHUB_SHA is the commit because releases deliberately use
              # lightweight tags; an annotated tag can make it the tag-object SHA.
              if [ -z "$ATTESTATIONS" ] || [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
                echo "::error::Refusing to accept ${NAME}@${WANT}: dist.attestations found '${ATTESTATIONS:-<absent>}' (expected a non-empty provenance attestation); gitHead found '${PUBLISHED_GIT_HEAD:-<absent>}' (expected '${GITHUB_SHA}')."
                exit 1
              fi
              echo "${NAME}@${WANT} already on public npm with verified provenance and gitHead ${GITHUB_SHA} — skipping."
            else
              npm publish -w "packages/${PKG}" --access public --provenance
            fi
          done

  # ---------------------------------------------------------------------------
  # Plugin leg #1: publish the openclaw-webchannel code-plugin to the PUBLIC npm
  # registry (registry.npmjs.org) via OIDC Trusted Publishing — NO long-lived
  # NPM_TOKEN. This is the registry-independent, zero-auth install path
  # (`openclaw plugins install openclaw-webchannel@<v>`), and the only npm one
  # since ClawHub publishing is currently blocked by a scanner false-positive on
  # the package. Since 0.6.1 the `publish` job it depends on ships the two scoped
  # packages the same way; this job stays separate because the plugin has its own
  # build, its own test suite, and its own trusted-publisher registration.
  #
  # PREREQUISITE (one-time, manual, on npmjs.com): a Trusted Publisher must be
  # configured for the `openclaw-webchannel` package —
  #   Package → Settings → Trusted Publisher → Add:
  #     Organization or user = mir-stream
  #     Repository           = openclaw-webchannel
  #     Workflow   = publish.yml
  #     Environment = (blank)
  #     Allowed actions = npm publish
  # Until that exists, the publish STEP is denied by npm. A matching version is
  # skipped only when its provenance and gitHead identify this exact run;
  # otherwise the idempotency guard fails loudly. This leg only actually
  # publishes — and thus only needs the trusted publisher — on the FIRST new
  # version after setup. With OIDC + npm >= 11.5.1, `npm publish` mints
  # short-lived credentials from the id-token automatically.
  #
  # Gated like the ClawHub leg: needs the client/saas leg, tag PUSH only.
  # ---------------------------------------------------------------------------
  publish-plugin-npm:
    name: Publish plugin to npm (public, OIDC)
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest  # 공개 저장소 전환(자체 호스팅 러너 폐지)
    permissions:
      contents: read
      # OIDC trusted publishing: npm exchanges this id-token for a short-lived
      # publish credential — no NPM_TOKEN secret in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with
      # setup-node's Node 22 is older, so upgrade before publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Enforce 3-way version lockstep (tag == plugin == client == saas)
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(node -p "require('./packages/plugin/package.json').version")"
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          SAAS_VERSION="$(node -p "require('./packages/saas/package.json').version")"
          echo "tag=${TAG_VERSION} plugin=${PLUGIN_VERSION} client=${CLIENT_VERSION} saas=${SAAS_VERSION}"
          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ] \
            || [ "$CLIENT_VERSION" != "$TAG_VERSION" ] \
            || [ "$SAAS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version lockstep violation — tag v${TAG_VERSION} must equal plugin/client/saas. Bump all three to match the tag before releasing."
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      # The plugin's nats-transport-realserver.test.ts HARD FAILS at module load
      # under CI when the nats-server binary is missing — same composite action
      # (pinned version + cache key) as the other legs.
      - name: Install nats-server (pinned, cached)
        uses: ./.github/actions/install-nats-server

      - name: Install
        run: npm ci

      - name: Plugin unit tests
        run: npm test -w packages/plugin
        env:
          CI: "true"

      - name: Build plugin
        # dist/ is gitignored and IS the published runtime — build before publish.
        run: npm run build -w packages/plugin

      - name: Skip if this version is already on public npm (idempotency)
        id: already
        run: |
          set -uo pipefail
          # Key off stdout, not exit code (npm view semantics differ across
          # majors). An absent version (empty / E404 / garbage) falls through to
          # publish. A version match is skipped ONLY after provenance and gitHead
          # identify this exact run; otherwise fail instead of accepting an
          # immutable tarball of unknown origin.
          GOT="$(npm view "openclaw-webchannel@${VERSION}" version 2>/dev/null || true)"
          if [ "$GOT" = "$VERSION" ]; then
            PUBLISHED_GIT_HEAD="$(npm view "openclaw-webchannel@${VERSION}" gitHead 2>/dev/null || true)"
            ATTESTATIONS="$(npm view "openclaw-webchannel@${VERSION}" dist.attestations 2>/dev/null || true)"
            # GITHUB_SHA is the commit because releases deliberately use
            # lightweight tags; an annotated tag can make it the tag-object SHA.
            if [ -z "$ATTESTATIONS" ] || [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
              echo "::error::Refusing to accept openclaw-webchannel@${VERSION}: dist.attestations found '${ATTESTATIONS:-<absent>}' (expected a non-empty provenance attestation); gitHead found '${PUBLISHED_GIT_HEAD:-<absent>}' (expected '${GITHUB_SHA}')."
              exit 1
            fi
            echo "openclaw-webchannel@${VERSION} already on public npm with verified provenance and gitHead ${GITHUB_SHA} — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "openclaw-webchannel@${VERSION} not on public npm — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish plugin to public npm (OIDC)
        if: steps.already.outputs.skip != 'true'
        # No NODE_AUTH_TOKEN: with a configured Trusted Publisher and npm >=
        # 11.5.1, `npm publish` performs the OIDC exchange itself.
        #
        # --provenance was held back while the repo was private, because the
        # attestation is restricted to PUBLIC source repos and `npm publish
        # --provenance` CANCELS the whole publish if generation fails. The repo
        # went public on 2026-08-19, so the gate is lifted and every release from
        # 0.6.0 on carries a signed link back to the workflow run that built it.
        # The other prerequisites were already in place: `id-token: write` above,
        # npm upgraded in the step near the top of this job, and packages/plugin
        # declares the matching `repository` field.
        #
        # If this ever fails, the failure is contained: the npm leg cancels with
        # nothing published, so drop the flag, delete the tag, and re-push it.
        # The client/saas leg that ran before this one is idempotent and will
        # skip on the retry.
        run: npm publish -w packages/plugin --access public --provenance

  # ---------------------------------------------------------------------------
  # Final public-npm assertion: npm moves each package's `latest` independently,
  # so a partially successful release can leave unversioned installs split across
  # versions even though every package version is immutable. Poll through npm's
  # publish-time scan horizon, then succeed only when all three reads succeed and
  # all three tags equal this release's version. Every other result fails closed.
  # ---------------------------------------------------------------------------
  verify-dist-tags:
    name: Verify public npm latest tags
    needs: [publish, publish-plugin-npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Bound the ~19.5-minute polling budget plus registry latency, limiting how
    # long this job can hold the npm-release concurrency group.
    timeout-minutes: 30
    # Deliberately no npm/OIDC publishing credential; the read-only GITHUB_TOKEN
    # is limited to contents: read and is not persisted by checkout.
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify all public npm latest tags
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CLIENT_NAME="$(node -p "require('./packages/client/package.json').name")"
          SAAS_NAME="$(node -p "require('./packages/saas/package.json').name")"
          PLUGIN_NAME="$(node -p "require('./packages/plugin/package.json').name")"
          NAMES=("$CLIENT_NAME" "$SAAS_NAME" "$PLUGIN_NAME")
          # npm's publish-time malware scan can delay availability for 15 minutes
          # or more, so a 60-second horizon can report a healthy release as split:
          # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
          # The 39 inter-attempt sleeps provide about 19.5 minutes of polling.
          MAX_ATTEMPTS=40
          RETRY_SECONDS=30

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            LATESTS=()
            READ_OKS=()
            ALL_EXPECTED=1
            echo "Checking npm latest tags (attempt ${attempt}/${MAX_ATTEMPTS})..."
            for NAME in "${NAMES[@]}"; do
              LATEST=""
              if LATEST="$(npm view "${NAME}" dist-tags.latest 2>/dev/null)"; then
                READ_OKS+=(1)
              else
                READ_OKS+=(0)
                ALL_EXPECTED=0
              fi
              LATESTS+=("$LATEST")
              if [ "$LATEST" != "$VERSION" ]; then
                ALL_EXPECTED=0
              fi
            done

            if [ "$ALL_EXPECTED" -eq 1 ]; then
              for i in "${!NAMES[@]}"; do
                echo "${NAMES[$i]} latest=${LATESTS[$i]} (confirmed)"
              done
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "npm latest tags have not converged; retrying in ${RETRY_SECONDS}s."
              sleep "$RETRY_SECONDS"
            fi
          done

          for i in "${!NAMES[@]}"; do
            if [ "${READ_OKS[$i]}" -ne 1 ]; then
              echo "::error::${NAMES[$i]} registry query failed while reading dist-tags.latest (expected '${VERSION}')."
            elif [ "${LATESTS[$i]}" != "$VERSION" ]; then
              echo "::error::${NAMES[$i]} latest is '${LATESTS[$i]}' (expected '${VERSION}')."
            fi
          done
          echo "npm's publish-time scan can delay availability by 15 minutes or more. Confirm the versions are actually installable before re-running; an immediate re-run can see a scan-pending version as absent and try to publish it again."
          echo "Then re-run the original tag-push run with 'gh run rerun <RUN_ID>'; the publish legs are idempotent."
          echo "A re-run of a superseded tag fails here by design because the three latest tags no longer point to that tag's version; re-run the current release's run instead, and never move latest backward."
          echo "If a version is published but its latest is still wrong, only an operator can repair it with interactive auth; CI's OIDC credential authorizes 'npm publish' and 'npm stage publish' but not 'npm dist-tag add'."
          echo "Use the exact name printed above: npm dist-tag add <name>@<version> latest --registry=https://registry.npmjs.org/"
          echo "If that name is scoped (@scope/...), override the SCOPE instead, e.g. --@mir-stream:registry=https://registry.npmjs.org/ — a plain --registry is ignored when an @scope:registry mapping exists."
          echo "Never move latest backward to an older release."
          echo "See the 'Recovering a split latest' section of docs/PUBLISHING.md."
          exit 1

  # ---------------------------------------------------------------------------
  # Plugin leg #2: publish the openclaw-webchannel code-plugin to ClawHub.
  #
  # Gated on `needs: publish` — if the npm publish failed the tag is a dud and
  # the plugin must not ship on its own. The `if:` guard requires a tag PUSH, so
  # every workflow_dispatch run skips this job. The same event-and-ref invariant
  # covers every public-npm publish surface: a dispatch from any ref publishes
  # nothing.
  # ---------------------------------------------------------------------------
  publish-plugin:
    name: Publish plugin to ClawHub
    needs: publish
    # ClawHub publishing is PROVISIONALLY DISABLED. npm is the distribution
    # channel that matters and it publishes fine; ClawHub has been sitting behind
    # a `scan:suspicious` moderation flag that pins `latest` at 0.2.0 regardless
    # of what we push, so the job could only ever go green while achieving
    # nothing — and a step that fails (or succeeds pointlessly) on every release
    # trains people to ignore a red pipeline.
    #
    # Left in place rather than deleted because this is provisional: the job body
    # (including the npm 11 pin for the CLI's `npm pack --json` bug, upstream
    # openclaw/clawhub#3275) is still correct and ready.
    #
    # TO RE-ENABLE: set repository variable PUBLISH_CLAWHUB to "true".
    # Unset/absent evaluates falsy, so the job stays skipped by default.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && vars.PUBLISH_CLAWHUB == 'true'
    runs-on: ubuntu-latest  # 공개 저장소 전환(자체 호스팅 러너 폐지)
    permissions:
      contents: read
      # Kept wired for forward-compat: the clawhub CLI tries an OIDC mint
      # (audience "clawhub") FIRST and only falls back to the stored token on
      # failure. It's inert until trusted publishing is registered — which was
      # impossible while this repo was private, and is merely not-yet-done now
      # that it is public. Register it and OIDC takes over automatically with no
      # workflow change (docs/PUBLISHING.md).
      id-token: write
    env:
      # Pin the ClawHub CLI so a registry-side CLI release can't silently change
      # the publish contract mid-release. Bump this DELIBERATELY and re-verify
      # the publish flow when you do.
      CLAWHUB_CLI: "clawhub@0.23.1"
      # Point the clawhub CLI at a temp config file we provision below with the
      # CLAWHUB_TOKEN secret (the OIDC fallback path). The CLI honors this
      # override (config.js getGlobalConfigPath). Literal /tmp because the
      # `runner` context is not available in job-level env.
      CLAWHUB_CONFIG_PATH: /tmp/clawhub-config.json
      # The clawhub CLI shells out to `npm pack --json` and reads the result as
      # an ARRAY (`JSON.parse(stdout)[0].filename`, dist/cli/commands/packages.js
      # in 0.23.1 — the latest release). npm 12 changed that payload to an OBJECT
      # keyed by package name, so `[0]` is undefined and the CLI aborts with
      # "npm pack did not return a tarball filename". Verified directly:
      #   npm 11 -> [ { "filename": "openclaw-webchannel-0.4.0.tgz", … } ]
      #   npm 12 -> { "openclaw-webchannel": { "filename": …, … } }
      # This is a CLI bug with no fixed release available, so pin the npm the CLI
      # sees. REMOVE THIS once the CLI handles npm 12's shape.
      CLAWHUB_NPM_PIN: "npm@11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Job-scoped only: installs into RUNNER_TEMP and prepends via GITHUB_PATH,
      # so no global npm is mutated and the pin cannot leak into another step.
      - name: Pin npm for the ClawHub CLI (see CLAWHUB_NPM_PIN)
        run: |
          set -euo pipefail
          npm i --silent --prefix "$RUNNER_TEMP/npm-pin" "$CLAWHUB_NPM_PIN"
          echo "$RUNNER_TEMP/npm-pin/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify the pinned npm is what the CLI will spawn
        run: |
          set -euo pipefail
          echo "npm on PATH: $(which npm) -> $(npm --version)"
          case "$(npm --version)" in
            11.*) echo "pin OK" ;;
            *) echo "::error::expected the pinned npm 11.x, got $(npm --version) — the ClawHub pack step would fail"; exit 1 ;;
          esac

      - name: Install
        run: npm ci

      - name: Enforce 3-way version lockstep (tag == plugin == client == saas)
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(node -p "require('./packages/plugin/package.json').version")"
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          SAAS_VERSION="$(node -p "require('./packages/saas/package.json').version")"
          echo "tag=${TAG_VERSION} plugin=${PLUGIN_VERSION} client=${CLIENT_VERSION} saas=${SAAS_VERSION}"
          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ] \
            || [ "$CLIENT_VERSION" != "$TAG_VERSION" ] \
            || [ "$SAAS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version lockstep violation — tag v${TAG_VERSION} must equal plugin/client/saas. Bump all three to match the tag before releasing."
            exit 1
          fi
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      # The plugin's nats-transport-realserver.test.ts HARD FAILS at module load
      # under CI when the nats-server binary is missing, so the plugin tests need
      # it installed too. Same composite action (and thus same pinned version +
      # cache key) as the publish job, so both legs share the one cache.
      - name: Install nats-server (pinned, cached)
        uses: ./.github/actions/install-nats-server

      - name: Plugin unit tests
        run: npm test -w packages/plugin
        env:
          CI: "true"

      - name: Build plugin
        # ClawHub validates dist/ on a real publish (not on --dry-run), and
        # dist/ is gitignored — so it MUST be built here before publishing.
        run: npm run build -w packages/plugin

      - name: Provision ClawHub token (OIDC fallback)
        # Write the CLI's global config ({registry, token}) to the runner-temp
        # path CLAWHUB_CONFIG_PATH points at. registry is REQUIRED by the CLI's
        # schema (a mismatch makes readGlobalConfig return null → "Not logged
        # in"). The secret is passed via env and written by node — never
        # interpolated into the shell script body.
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CLAWHUB_TOKEN:-}" ] || { echo "::error::CLAWHUB_TOKEN secret is missing"; exit 1; }
          node -e 'require("fs").writeFileSync(process.env.CLAWHUB_CONFIG_PATH, JSON.stringify({ registry: "https://clawhub.ai", token: process.env.CLAWHUB_TOKEN }), { mode: 0o600 })'

      - name: Skip if this version is already on ClawHub (idempotency)
        id: already
        run: |
          set -uo pipefail
          # Don't trust the exit code: `package inspect` exits 0 for a missing
          # PACKAGE (only a missing VERSION is non-zero), so a deleted/renamed
          # package could be misread as "already published" and skipped forever.
          # Confirm positively that the returned JSON contains THIS version;
          # anything else (parse failure / missing package / missing version)
          # falls through to publish (fail-toward-publish).
          OUT="$(npx --yes "$CLAWHUB_CLI" package inspect openclaw-webchannel \
            --version "$VERSION" --json 2>/tmp/clawhub-inspect-stderr.log || true)"
          if printf '%s' "$OUT" | VERSION="$VERSION" node -e '
              let raw = "";
              process.stdin.on("data", (d) => (raw += d)).on("end", () => {
                try {
                  const j = JSON.parse(raw);
                  if (j && j.version && j.version.version === process.env.VERSION) process.exit(0);
                } catch {}
                process.exit(1);
              });
            '; then
            echo "openclaw-webchannel@${VERSION} confirmed on ClawHub — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "openclaw-webchannel@${VERSION} not confirmed present — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ -s /tmp/clawhub-inspect-stderr.log ]; then
              echo "--- clawhub inspect stderr (for diagnosis; publish proceeds regardless) ---"
              cat /tmp/clawhub-inspect-stderr.log
            fi
          fi

      - name: Publish plugin to ClawHub
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npx --yes "$CLAWHUB_CLI" package publish packages/plugin \
            --family code-plugin \
            --owner mir-stream \
            --version "$VERSION" \
            --source-repo mir-stream/openclaw-webchannel \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path packages/plugin \
            --changelog "Release ${GITHUB_REF_NAME} — see repo changelog" \
            --json
