################################################################################
# publish.yml — Publish @mir-stream/webchannel-client and
# @mir-stream/webchannel-saas to GitHub Packages (private npm registry).
#
# Trigger: push a tag like v0.1.0 (both packages share one version), or run
# manually via workflow_dispatch. Uses the built-in GITHUB_TOKEN — no PAT or
# npm creds needed on the publish side; packages inherit the repo's private
# visibility.
#
# Consumers need an .npmrc pointing @mir-stream at npm.pkg.github.com plus a
# read:packages token — see docs/PUBLISHING.md.
################################################################################

name: Publish Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Must match e2e-gate.yml — saas real-server suites HARD FAIL (not skip)
      # in CI when the nats-server binary is missing.
      NATS_SERVER_VERSION: "v2.14.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@mir-stream"

      - name: Cache nats-server binary
        id: cache-nats
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/nats-server
          key: nats-server-${{ env.NATS_SERVER_VERSION }}-linux-amd64

      - name: Install nats-server ${{ env.NATS_SERVER_VERSION }}
        if: steps.cache-nats.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION="${NATS_SERVER_VERSION}"
          TARBALL="nats-server-${VERSION}-linux-amd64.tar.gz"
          URL="https://github.com/nats-io/nats-server/releases/download/${VERSION}/${TARBALL}"
          curl -fsSL "${URL}" -o "/tmp/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          sudo mv "/tmp/nats-server-${VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          sudo chmod +x /usr/local/bin/nats-server
          rm -rf "/tmp/${TARBALL}" "/tmp/nats-server-${VERSION}-linux-amd64"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build -w packages/client -w packages/saas

      - name: Unit tests (client + saas)
        run: |
          npm test -w packages/client
          npm test -w packages/saas
        env:
          CI: "true"

      - name: Publish to GitHub Packages
        run: npm publish -w packages/client -w packages/saas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
