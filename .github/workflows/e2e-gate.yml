################################################################################
# e2e-gate.yml — Single blocking CI gate for openclaw-webchannel Phase B.
#
# Enforces:
#  - All pre-existing test suites stay green, and none of them QUIETLY VANISH:
#    every file the ROOT VITEST SWEEP collects (packages/*/src/**, demo/**,
#    e2e/*.test.ts) must match its count in .github/test-inventory.json exactly
#    (see step 7 — the old "≥1465" constant could not fail).
#    examples/** remains outside that count because it exercises packed public
#    entries with Node resolution semantics. Each of its four consumer files is
#    run separately under node:test with a zero-registration guard, so an empty
#    file cannot inherit Node's successful file-level wrapper result.
#  - 3-package typecheck passes clean
#  - Real nats-server v2.14 installed so real-server suites run (not silently skipped)
#  - The register-hop (enrolled-JWT) admission path is covered end-to-end
#
# The gate runs on every push and PR to the integration branches AND to the
# working branches where development actually happens (develop, feature/**) —
# review 2026-07-02 (O1): previously it triggered only on main/master/jwks, so
# the branch all work lands on (develop) and every feature/* branch shipped
# with the gate never running. NEVER disable or skip this gate — it is the
# definition of "plugin done".
################################################################################

name: E2E Gate

on:
  push:
    branches: [main, master, develop, review, "feature/**"]
  pull_request:
    branches: [main, master, develop, review]

# Only one gate run per branch/PR at a time; cancel stale in-progress runs.
concurrency:
  group: e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: E2E Gate (nats-server v2.14 + Typecheck + Tests)
    # GitHub-hosted, NOT self-hosted. This gate triggers on `pull_request`, has
    # no fork guard, and checks out the PR merge ref — on a public repository a
    # self-hosted runner would therefore execute fork-authored code on the
    # maintainer's own machine, on a non-ephemeral host that also carries the
    # publish lane. Hosted runners are ephemeral and free for public repos, so
    # the exposure and the CI cost both disappear. Do not move this back.
    runs-on: ubuntu-latest

    # Declared at JOB level, not repository level. The repository's default
    # workflow-token permission is `read`, which grants contents/metadata/
    # packages read but NOT `actions` — so the cache-health guard below (which
    # lists this repository's cache entries over the REST API) would 403 without
    # this block. Spelling both scopes out also NARROWS the token on what is now
    # a public repository: an explicit block replaces the default set entirely,
    # so this job carries read on exactly these two and nothing else.
    # publish.yml is deliberately untouched — it carries the OIDC publish
    # credentials and its own minimal permissions block, and no cache-hygiene
    # check may be able to redden the release lane. It DOES share the
    # install-nats-server composite, and therefore now runs the lookup-only
    # probe on a nats cache miss — but that cannot fail it: the guard script is
    # invoked only here, and @actions/cache downgrades every non-ValidationError
    # to a warning (the very swallowing this guard exists to detect), while the
    # ValidationError paths are pre-cleared by the primary cache step in the
    # same composite using identical path and key values.
    permissions:
      contents: read
      actions: read

    # Pin the Node.js version — must match the engines.node range declared
    # in each published package.json.
    env:
      NODE_VERSION: "22"
      # Signal to real-server test suites that nats-server MUST be present.
      CI: "true"

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────
      # 2. Node.js setup (pinned to engines.node baseline)
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ──────────────────────────────────────────────────────────────────────
      # 3. Install nats-server v2.14 (cached)
      #    Required by:
      #      - packages/plugin/src/nats-transport-realserver.test.ts
      #      - packages/saas/src/nats-permissions-realserver.test.ts
      #    Without this binary, under CI=true both THROW at module top level — a
      #    hard fail, not a skip, and one that also fails collection in step 7.
      #    The pinned version + cache key live in the composite action
      #    (.github/actions/install-nats-server) — the single source of truth
      #    shared with publish.yml. It installs under $RUNNER_TOOL_CACHE and
      #    exports that dir via $GITHUB_PATH (PR #50; it is NOT /usr/local/bin),
      #    which is why every later step — the run AND step 7's collection —
      #    resolves the binary identically.
      # ──────────────────────────────────────────────────────────────────────
      #    The `id` is what makes the action's primary and probe cache outputs
      #    reachable by the cache-health guard in step 4c.
      - name: Install nats-server (pinned, cached)
        id: nats
        uses: ./.github/actions/install-nats-server

      # ──────────────────────────────────────────────────────────────────────
      # 4. Install dependencies (all workspaces)
      # ──────────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ──────────────────────────────────────────────────────────────────────
      # 4a. Keep documentation and source comments bound to durable contracts.
      #     A citation is judged by provenance, not by how its basename looks:
      #     OpenClaw's declared package exports are durable, anything else in
      #     its dist/ tree is internal build output that a core build replaces.
      #     Runs after `npm ci` on purpose -- the gate reads the installed
      #     dist/ tree and fails closed if it is missing or incomplete.
      # ──────────────────────────────────────────────────────────────────────
      - name: Lint durable OpenClaw citations
        run: npm run lint:citations

      # ──────────────────────────────────────────────────────────────────────
      # 4b. Install Playwright Chromium for E2E tests
      #
      # The E2E gate drives a real headless Chromium browser through the NATS
      # dial seam.  playwright-core is bundled with the `openclaw` dependency;
      # we use its CLI to download and cache the managed Chromium binary.
      # ──────────────────────────────────────────────────────────────────────
      # The key AND the path are defined ONCE, here, because both are read in
      # more than one place (the cache step, the lookup-only probe below, and —
      # for the key — the cache-health guard). A duplicated hashFiles()
      # expression is a key that drifts the first time one copy is edited, and a
      # guard checking a key nothing writes is worse than no guard.
      #
      # The path is exactly as load-bearing as the key: GitHub matches a cache
      # by (KEY, VERSION, REF), and `version` hashes the raw `path:` STRING. A
      # duplicated path therefore drifts into a different cache version — and
      # unlike key drift, which the guard detects (`--probe-key` != `--key` is a
      # hard error), path drift is invisible from the script and produces a
      # PERMANENT false POISONED: it recurs on every re-run, so the remedy's own
      # "re-run first" discriminator reports poison confirmed and an operator
      # deletes a healthy 263 MB cache to unblock merges. The nats probe already
      # avoids this by reading $NATS_SERVER_DIR on both sides.
      #
      # Both strings are byte-identical to the literals they replace, so the
      # live entry keeps matching. `~` must stay literal — tilde expansion does
      # not occur inside double quotes, and an expanded /home/runner path is a
      # different string and so a different cache version. Safe at this position
      # because the cache step already sits AFTER `npm ci`, so the hashed file
      # exists.
      - name: Define Playwright cache key and path
        run: |
          echo "PLAYWRIGHT_CACHE_KEY=playwright-chromium-${{ hashFiles('node_modules/openclaw/node_modules/playwright-core/package.json') }}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CACHE_PATH=~/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_CACHE_PATH }}
          # Key includes the playwright-core version so the cache invalidates
          # when playwright is upgraded in the openclaw package.
          key: ${{ env.PLAYWRIGHT_CACHE_KEY }}

      # Lookup-only probe for the poisoned-cache guard in 4c. GitHub matches a
      # cache by (KEY, VERSION, REF), and `version` is a private hash of the
      # cached PATH plus the compression method — so "an entry exists under this
      # key" (all the REST API can tell us) is NOT "an entry exists that this
      # run could have restored". Edit `path:` above and every older entry keeps
      # the key while becoming permanently unrestorable, which is healthy, and
      # which a key-only check would report as poison and order deleted.
      #
      # We do not reconstruct that hash — we ASK THE ACTION. Same path, same
      # key, so the same version, and `lookup-only: true` answers existence
      # without downloading anything.
      #
      # >>> `path:` AND `key:` BELOW MUST RESOLVE FROM THE SAME $GITHUB_ENV
      # >>> DEFINITIONS THE CACHE STEP ABOVE USES. <<< Both come from the
      # "Define Playwright cache key and path" step, so there is ONE definition
      # of each rather than two copies to hand-synchronise. Do not inline either
      # one back here: a different path string is a different cache VERSION,
      # which would silently turn this into the answer to a question nobody
      # asked — and unlike a drifted key, a drifted path is undetectable from
      # the guard script.
      #
      # Inert on the happy path: gated on the primary NOT reporting a hit, so a
      # restored cache never pays for it.
      #
      # BOTH outputs are threaded to the guard, and the second is not redundant.
      # `cache-hit` is "" on a genuine MISS as well as when the step is skipped
      # — actions/cache sets it only to "true" on an exact match ("`cache-hit`
      # is intentionally not set to `false` here", restoreImpl.ts, actions/cache
      # issue 1466). So an empty `cache-hit` cannot tell a cold key from a probe
      # that never ran. `cache-primary-key` can: restoreImpl records it BEFORE
      # the miss return, so it is non-empty whenever the step ran, and empty
      # only when it was skipped.
      - name: Probe the Playwright cache at this run's version
        id: probe-playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_CACHE_PATH }}
          key: ${{ env.PLAYWRIGHT_CACHE_KEY }}
          lookup-only: true

      # ──────────────────────────────────────────────────────────────────────
      # 4c. Catch a POISONED cache entry — a defect that is otherwise invisible.
      #
      #     When an entry exists under a key but cannot be extracted, tar fails,
      #     actions/cache SWALLOWS the failure and prints the exact same "Cache
      #     not found for input keys" a cold key prints. The guarded install
      #     step re-provisions from the network, the job stays green, and the
      #     save at the end fails because the key is already taken — so the
      #     broken entry holds that key FOREVER and re-burns the download every
      #     run. The last instance survived four green runs at ~13s + 263 MB
      #     apiece and was found only by reading logs by hand.
      #
      #     The fingerprint is "reported a MISS, but a lookup-only probe at the
      #     SAME path and key — and therefore the same cache version — finds an
      #     entry anyway". Both booleans are produced inside this job — the
      #     playwright pair by the two steps just above, the nats pair inside
      #     .github/actions/install-nats-server, where the probe sits adjacent
      #     to the cache step it mirrors. They are what decides. The REST cache list is DIAGNOSTIC ONLY: it
      #     turns a failure into an actionable message (which entries, on which
      #     refs, at which versions, and their `id`, since deleting by `?key=`
      #     would take out healthy siblings on other refs). Every REST failure
      #     is a warning, never a verdict — a gate that reddens because
      #     api.github.com hiccuped defends nothing.
      #
      #     Placed BEFORE "Install Playwright Chromium" on purpose: fail fast
      #     rather than after paying the re-download the cache was meant to
      #     prevent.
      #
      #     setup-node's internal npm cache is deliberately NOT covered. Its key
      #     format is GitHub's private implementation detail, and reconstructing
      #     it here would rot into a check of a key nothing writes.
      # ──────────────────────────────────────────────────────────────────────
      - name: Verify cache entries are healthy (poisoned-cache guard)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-cache-health.mjs \
            --cache nats \
            --key "${{ steps.nats.outputs.cache-key }}" \
            --hit "${{ steps.nats.outputs.cache-hit }}" \
            --probe "${{ steps.nats.outputs.probe-hit }}" \
            --probe-key "${{ steps.nats.outputs.probe-key }}" \
            --cache playwright \
            --key "${{ env.PLAYWRIGHT_CACHE_KEY }}" \
            --hit "${{ steps.cache-playwright.outputs.cache-hit }}" \
            --probe "${{ steps.probe-playwright.outputs.cache-hit }}" \
            --probe-key "${{ steps.probe-playwright.outputs.cache-primary-key }}"

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          node node_modules/openclaw/node_modules/playwright-core/cli.js install chromium

      # Verify rather than provision. `install-deps chromium` used to run here on
      # the reasoning that host packages live outside the browser cache and so
      # must be reinstalled every run. True — but on the hosted ubuntu image all
      # 26 libraries Chromium links are already present, so the command spent
      # ~130s on an `apt-get update` (11.4 MB of indexes) only to report
      # "already the newest version" 26 times, then installed 9 CJK/X font
      # packages. Nothing in this gate renders text: the Chromium peer asserts
      # NATS frames and ids, never pixels.
      #
      # Booting the same binary with the same flags proves more than the install
      # did, in ~1s. If a runner image ever does drop a library this fails here
      # with Playwright's own diagnostic naming it — install exactly that, and do
      # not restore the blanket install-deps.
      - name: Verify Chromium launches with the e2e flags
        run: node scripts/check-chromium-launchable.mjs

      # ──────────────────────────────────────────────────────────────────────
      # 5. Typecheck — all 3 packages must be clean
      #    packages/client  → tsc --noEmit
      #    packages/plugin  → tsc --noEmit
      #    packages/saas    → tsc --noEmit
      # ──────────────────────────────────────────────────────────────────────
      - name: Typecheck (client)
        run: npm run typecheck --workspace=packages/client

      - name: Typecheck (plugin)
        run: npm run typecheck --workspace=packages/plugin

      - name: Typecheck (saas)
        run: npm run typecheck --workspace=packages/saas

      # ──────────────────────────────────────────────────────────────────────
      # 5b. Build the publishable packages (dist/) and run the examples'
      #     CONSUMER tests with their own node:test/TAP runner.
      #     They import @mir-stream/* by package ENTRY (main/exports → dist/),
      #     exactly like a downstream consumer — no dist ⇒ no resolve. They are
      #     deliberately EXCLUDED from the root vitest sweep (vitest.config.ts):
      #     vite's resolver doesn't produce the node error codes they assert.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build packages (saas + client dist for examples tests)
        run: |
          npm run build --workspace=packages/saas
          npm run build --workspace=packages/client

      # ──────────────────────────────────────────────────────────────────────
      # 5c. Build the plugin dist/ bundle BEFORE any harness loads it.
      #     package.json openclaw.extensions/setupEntry point at ./dist/*.js
      #     (the self-contained esbuild bundle that a remote `plugins install`
      #     loads); dist/ is gitignored, so `npm ci` alone leaves it absent.
      #     The live-e2e harnesses (steps 8–8g) swap the entry to the TS source
      #     for their own runs, but building here keeps dist/ fresh and makes
      #     the committed entry resolvable in CI.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build plugin (dist/ bundle)
        run: npm run build --workspace=packages/plugin

      # ──────────────────────────────────────────────────────────────────────
      # 5d. Pack-and-load smoke — F3 remote-install regression guard.
      #     Packs the plugin, installs ONLY production deps (--omit=dev), and
      #     LOADS both declared dist entries. Catches a runtime import that a
      #     future change misplaces into devDependencies (builds green,
      #     breaks remote install) — which no other CI step would detect.
      # ──────────────────────────────────────────────────────────────────────
      - name: Plugin pack-and-load smoke (F3 remote-install guard)
        run: bash scripts/pack-load-smoke.sh

      - name: Client clean-pack surface smoke (stale dist guard)
        run: bash scripts/client-pack-smoke.sh

      - name: Removed gateway transport symbol guard
        run: bash scripts/check-banned-symbols.sh

      - name: Examples consumer tests (public-API boundary)
        run: |
          npm test --workspace=examples/minimal-consumer
          npm test --workspace=examples/webchannel-app

      # ──────────────────────────────────────────────────────────────────────
      # 6. Run all test suites. This step owns FAILURES; step 7 owns DELETIONS,
      #    and the two are independent — step 7 collects the suite itself rather
      #    than reading a count this step produces, because a run COUNT is
      #    unusable as a gate (see step 7 on the runtime self-skips).
      #
      #    DO NOT NARROW THIS COMMAND. Its scope is what decides how much of the
      #    suite actually executes, and nothing else in the gate depends on it:
      #    add a path, --project, --shard or --changed and this step still exits
      #    0 while thousands of tests never run. The --scope assertion below is
      #    the guard — it holds the run to the file list in the inventory, and
      #    it lives INSIDE this step so it cannot be separated from the command
      #    it constrains. It compares file paths only, never counts, so the
      #    runtime self-skips cannot flake it.
      #    The path-only scope assertion cannot itself see a test-name filter,
      #    but step 6b compares completed counts and makes filtered assertions
      #    red outside its two explicit width-2 flake budgets. A swapped/narrowed
      #    config likewise leaves missing or under-completed inventory files.
      #    Add none of those filters here.
      #
      #    - Real-server suites run against the real nats-server from step 3:
      #      their `skipIf(!NATS_SERVER_BIN)` is SATISFIED (the binary is found),
      #      not removed — and under CI=true its absence throws instead.
      #    - The browser-driven roundtrips are NOT in this sweep; they are the
      #      live-e2e harness steps (8c-8g) below.
      # ──────────────────────────────────────────────────────────────────────
      - name: Run full test suite
        run: |
          rm -f "$VITEST_RESULTS"
          npx vitest run --reporter=default --reporter=json --outputFile="$VITEST_RESULTS"
          node scripts/check-test-inventory.mjs --scope "$VITEST_RESULTS"
        env:
          VITEST_RESULTS: ${{ runner.temp }}/vitest-results.json
          # CI=true turns a missing nats-server into a hard throw in the two
          # realserver suites instead of a silent skip. The binary itself is found
          # via $GITHUB_PATH from step 3 — NATS_SERVER_CANDIDATES probes PATH plus
          # /usr/local/bin, /usr/bin and /opt/homebrew/bin.
          CI: "true"

      # ──────────────────────────────────────────────────────────────────────
      # 6b. Bound runtime self-skips independently from collection inventory.
      #
      #     The report is compared file-by-file with the collected snapshot:
      #     collected minus passed/failed is the runtime skip count. Static
      #     .skip/.todo entries do not inflate it because they were never in the
      #     collected count. Unlisted files allow zero; the two noisy files and
      #     their width-2 budgets are committed in
      #     .github/runtime-skip-allowances.json. The checker also requires each
      #     allowance's ctx.skip source sites to remain live, forcing obsolete
      #     exceptions to be removed.
      # ──────────────────────────────────────────────────────────────────────
      - name: Verify runtime skip budgets (unlisted files allow zero)
        if: always()
        run: npm run test:runtime-skips -- "$VITEST_RESULTS"
        env:
          VITEST_RESULTS: ${{ runner.temp }}/vitest-results.json

      # ──────────────────────────────────────────────────────────────────────
      # 7. Verify no test disappeared — per-file inventory, exact match.
      #
      #    This step used to assert `numPassedTests >= 1465`, a seed-time
      #    constant nobody ever revisited. The suite has since grown to nearly
      #    double that, so the assertion became unfailable: whole packages could
      #    be deleted and it would still print "Baseline check passed". It sat
      #    green and useless for a month. Bumping the number would only restart
      #    that clock, so the expectation now lives in a COMMITTED per-file
      #    snapshot (.github/test-inventory.json) compared EXACTLY, both ways:
      #      - a file with fewer collected tests (or gone)  → REGRESSION, red
      #      - a file with more, or a brand-new file        → DRIFT, red
      #    Growth failing is the anti-rot mechanism: the first PR that adds a
      #    test must regenerate the snapshot (`npm run test:inventory:update`),
      #    so the snapshot can never quietly fall behind the suite, and every
      #    deletion lands in review as an explicit negative diff.
      #
      #    Skipped tests count for nobody: `.skip`/`.todo`-ing a test reads as a
      #    count drop and fails here, because `vitest list` omits them. A dormant
      #    `skipIf` real-server suite is red too, but by a different route in this
      #    job than on a dev box: here CI=true makes both realserver files throw at
      #    module top level, so collection FAILS ("'vitest list' exited 1"); with
      #    CI unset `skipIf` merely drops them and it is a count drop (-23).
      #
      #    It counts what `vitest list` COLLECTS, never what a run reported.
      #    Two suites self-skip at runtime on environment noise: the port-scan
      #    pair in nats-transport.test.ts and the listen(2)/EPERM path in
      #    p1-1-http-ui-contract.test.ts. Both are unobserved by this check, by
      #    design. Counting what ran would let that
      #    noise print "tests disappeared" on a good tree — and the fix that
      #    message prints could not clear it, because regenerating collects
      #    statically. The only way out would be committing the flake-lowered
      #    number, which would then make deleting those tests green forever.
      #    Collection sees no runtime skips, so the guard cannot be flaked into
      #    being disarmed. It is the same `npm run test:inventory` a developer
      #    runs locally — a green local check IS this gate, not an approximation.
      #
      #    Three things this COLLECTION step cannot see, stated so nobody assumes
      #    otherwise: a test replaced in-place by a vacuous one (nothing
      #    count-based can — that is review's job); a collected test that
      #    self-skips at runtime (step 6b bounds it); and examples/**, whose
      #    node:test zero-registration guard lives in the consumer step.
      #
      #    Costs one collection pass — ~25s measured, no test body, no hook, no
      #    listener — and needs nats-server from step 3 on PATH, as the run does.
      # ──────────────────────────────────────────────────────────────────────
      - name: Verify test inventory (no test silently deleted or skipped)
        if: always()
        run: npm run test:inventory

      # ──────────────────────────────────────────────────────────────────────
      # 8c. Live e2e: enrolled-NATS-transport (device-flow)
      #    The plugin obtains tenant-scoped NATS creds via the REAL
      #    device-flow enrollment-server and NKEY-connects to a JWT-auth
      #    nats-server from ONE shared trust chain. Node driver, no Chromium.
      #    Isolated under /tmp/oc-enrolled-e2e (port 18999) — hermetic, no
      #    secret. Any non-zero exit FAILS the gate.
      # ──────────────────────────────────────────────────────────────────────
      - name: "Live e2e: enrolled-NATS-transport (device-flow)"
        run: bash e2e/local/run-enrolled-transport.sh

      # ──────────────────────────────────────────────────────────────────────
      # 8d. Live e2e: turn outcome on provider rejection (issue #87 gate)
      #    `turn_settled{outcome}` is what the browser client promotes a user
      #    message's sendState from — `ok` → completed (✓), `error` → failed,
      #    which is also what gates the retry affordance. A turn rejected by the
      #    PROVIDER used to settle `ok`: a ✓ with no retry on a turn that never
      #    answered. Only a live gateway can stage this — core does NOT throw on
      #    a provider rejection, it returns its terminal message as an ordinary
      #    `isError` reply payload, so the plugin's turn resolves cleanly and its
      #    catch never runs. Two turns in one boot: a rejected one (must settle
      #    `error` and still show the user core's message) and an ordinary one
      #    (must still settle `ok`, so an "always error" fix cannot pass).
      #    Isolated under /tmp/oc-turn-outcome-e2e (port 18981) — hermetic, no
      #    secret. Any non-zero exit FAILS the gate.
      # ──────────────────────────────────────────────────────────────────────
      - name: "Live e2e: turn outcome on provider rejection (#87)"
        run: bash e2e/local/run-turn-outcome.sh

      # ──────────────────────────────────────────────────────────────────────
      # 8d². Live e2e: multi-assistant-message turn (issue #94 gate)
      #    In `streaming.mode:"partial"` the channel used to mint ONE draft id
      #    per TURN and accumulate every assistant message into it; the turn's
      #    `final` then replaced that merged bubble with the LAST message's text,
      #    erasing earlier assistant text the user had already watched stream.
      #    The fix gives each assistant message its own lane, id and terminal
      #    frame, so a multi-message turn must settle as TWO DISTINCT ids.
      #    Only a live gateway can stage this: the second assistant message comes
      #    from core's own agent loop over a real tool call (the echo provider
      #    answers phase 1 with text + `tool_calls`, core executes `agents_list`
      #    and comes back for phase 2), which is also the only way to observe how
      #    core interleaves partials with block drains — the ordering that both
      #    review rounds on the fix found unit fixtures getting wrong.
      #    Asserts: >=2 `agent_message` frames with distinct ids, message A
      #    present and not overwritten by B, model order preserved, and
      #    `turn_settled{outcome:"ok"}` still delivered (so an unconditional-
      #    rotation fix cannot pass). The driver logs EVERY inbound frame first.
      #    Isolated under /tmp/oc-multi-message-e2e (port 18991) — hermetic, no
      #    secret. Verified load-bearing by revert-check: with the fix reverted
      #    the harness exits 6. Any non-zero exit FAILS the gate.
      # ──────────────────────────────────────────────────────────────────────
      - name: "Live e2e: multi-assistant-message turn settles two ids (#94)"
        run: bash e2e/local/run-multi-message.sh

      # ──────────────────────────────────────────────────────────────────────
      # 8e. Live e2e: ALL-REAL fusion
      #    Fuses the enrolled-transport server topology with the real-browser
      #    driver: the Chromium peer NKEY-auths to the JWT-auth nats-server AND
      #    drives the PoP register hop against a REAL enrolled plugin — all from
      #    ONE trust chain (only the echo LLM is a stand-in). Isolated under
      #    /tmp/oc-allreal-e2e (port 19199) — hermetic, no secret. Any non-zero
      #    exit FAILS the gate.
      # ──────────────────────────────────────────────────────────────────────
      - name: "Live e2e: ALL-REAL fusion"
        run: bash e2e/local/run-all-real.sh

      # ──────────────────────────────────────────────────────────────────────
      # 8f. Live e2e: one-process/two-account isolation (issue #54 gate)
      #    ONE gateway serves two account runtimes sharing tenant/relay/issuer/JWKS.
      #    Its latest structured aggregate record must report complete 2/2.
      #    Production clients prove A→A and B→B, then an A-authorized token sent
      #    to B's live register subject must receive exact opaque 401 with no B
      #    peer/key/history/approval effect, followed by another healthy B→B.
      #    The host starts both accounts through the coordinator and production
      #    account-bound NatsChannels plus binding.account routing (no mocks).
      #    Node-only, hermetic under /tmp/oc-two-acct-e2e; non-zero exit fails.
      # ──────────────────────────────────────────────────────────────────────
      - name: "Live e2e: 2-account routing isolation"
        run: bash e2e/local/run-two-account-isolation.sh

      # ──────────────────────────────────────────────────────────────────────
      # 8g. Live e2e: DERIVED trust anchor (zero hand-written JWT trust facts)
      #    The ONLY harness that exercises `deriveAccountAuth` end-to-end: a fresh
      #    `openclaw channels add` writes NO issuer/jwksUrl/audience (config-present-
      #    wins would mask derivation otherwise). Asserts the on-disk config holds
      #    zero trust facts, the Gate-B readiness line reports the DERIVED
      #    issuer=<saasBaseUrl> · JWKS N>=1 keys · aud=<accountId> · register-hop,
      #    then round-trips a real headless-Chromium encrypted register through the
      #    live hop. Isolated under /tmp/oc-derived-e2e (port 19399) — hermetic, no
      #    secret. Any non-zero exit FAILS the gate.
      # ──────────────────────────────────────────────────────────────────────
      - name: "Live e2e: DERIVED trust anchor (zero hand-written trust facts)"
        run: bash e2e/local/run-derived-trust.sh
