goal: 'WebChannel 페어링 재설계 가-1: device-flow 자격증명 획득을 gateway runtime에서 config-time(openclaw channels add)으로 이동하고, channels.webchannel.<account> 다중 계정 지원 및 accountId 기반 binding.account 라우팅을 구현한다.'
task_type: code
constraints:
- gateway run은 creds를 획득하지 않고 소비만 한다(없으면 account-scoped graceful degradation)
- 한 gateway run = 설정된 모든 webchannel account 동시 멀티플렉스 서빙, gateway run --account 선택자 도입 금지
- 'account-scoped graceful degradation: creds 없음/만료 account는 즉시(런타임 enroll 시도·폴링·행 없이) 서빙에서 제외하고 actionable 로그를 남기며, 런타임/타 account/타 채널(telegram 등)에 무영향(프로세스 크래시 금지)'
- 'actionable 로그 = skip된 account id 와 재실행 명령(openclaw channels add --channel webchannel --account <id>)을 포함한다'
- NATS subject는 webchannel.{tenant}.{agentId}.{peerId} 모양 유지 → SaaS/client 와이어 무변경(accountId 개명은 가-2)
- 단일 register 라우트가 JWT aud(=agentId=account 키)로 어느 account 채널에 registerPeer 할지 내부 디스패치(account별 path 신설 금지)
- creds는 account별 ~/.openclaw-webchannel/<account>/credentials.json 에 영속
- acquisition-identity env(WEBCHANNEL_TENANT/_AGENT_ID/_SAAS_BASE_URL)는 deprecated; account config 부재 시에만 'default' account 합성에 사용, config 존재 시 무시(+1회성 deprecation 경고, 크래시 금지)
- connection/static-creds env(WEBCHANNEL_NATS_URL/_NATS_USER_JWT/_USER_SEED/_CREDS/_LEGACY_UNAUTHENTICATED)는 런타임 연결 override 의미 유지
- 'default'는 예약어 아닌 일반 account id(명시 --account default 허용)
- legacy ~/.openclaw-webchannel/credentials.json 존재 시 'default' account creds로 읽는 하위호환 fallback
- channels add는 전부-플래그 비대화형 모드 필수(TTY 의존 금지); afterAccountConfigWritten에서 폴링
- 승인은 기존 SaaS /approve 불변(토큰 주입 메커니즘 신설 금지)
acceptance_criteria:
- AC1 gateway run은 creds를 획득하지 않고 영속된 account creds를 소비만 한다(획득은 config-time openclaw channels add로 이동)
- AC2 전부-플래그 비대화형 openclaw channels add --channel webchannel --account X 가 TTY 없이 creds를 ~/.openclaw-webchannel/X/credentials.json 에 영속하고 exit 0 한다
- AC3 channels.webchannel.<account> 다중 계정을 한 gateway run이 동시 멀티플렉스 서빙하며 account별 enrolled creds로 N개의 NATS 연결/구독을 연다
- AC4 creds 없음/만료 account만 account-scoped graceful degradation으로 서빙 제외되고(actionable 로그), 런타임/타 account/타 채널은 무영향이다
- AC5 cred-source 해석 — account config가 존재하면 config가 acquisition-identity env를 결정론적으로 우선하고(env 무시 + 1회성 deprecation 경고, 크래시 없음), config 부재 시에만 'default' account를 합성하며 legacy 단일 creds를 'default'로 fallback한다
- AC6 account별 라우팅 격리 — agents bind --agent X --bind webchannel:<account> 가 그 account inbound를 해당 agent로만 보내며, 2-account 통합 e2e(acctA→agentA, acctB→agentB)에서 acctA inbound가 agentB에 도달하지 않음으로 검증된다
- AC7 재설계 후 기존 채널(webchannel 단일 계정 경로 및 telegram 등 타 채널)이 변경 없이 계속 서빙된다(회귀 없음)
ontology_schema:
  name: WebChannelAccountModel
  description: config-time 자격증명 획득과 다중 계정 멀티플렉스 서빙을 위한 WebChannel account 도메인 모델
  fields:
  - {name: accountId, type: string, description: account 식별자(라우팅 키, default는 일반 id)}
  - {name: tenant, type: string, description: 배포 tenant 식별자}
  - {name: agentId, type: string, description: account와 1:1 매핑 agent id(JWT aud, 와이어 키)}
  - {name: credentialsPath, type: string, description: account별 creds 영속 경로}
  - {name: enrolledCreds, type: object, description: '[derived/internal] device-flow로 획득해 영속된 NATS user JWT/seed'}
  - {name: peerId, type: string, description: 브라우저 세션 식별자 — SaaS/client 소유 opaque 와이어 토큰(본 seed 신규 정의 대상 아님)}
  - {name: natsSubject, type: string, description: webchannel.{tenant}.{agentId}.{peerId} 구독 subject}
  - {name: registerDispatchKey, type: string, description: '[derived/internal] 단일 register 라우트가 JWT aud(=agentId)로 account 채널에 registerPeer 디스패치하는 키'}
  - {name: bindingTier, type: string, description: binding.account 라우팅 대상(account→agent)}
  - {name: servingStatus, type: string, description: active/graceful-degraded account 서빙 상태}
  - {name: degradationReason, type: string, description: '[derived/internal] graceful degradation 원인(none/missing/expired) — actionable 로그에 반영'}
evaluation_principles:
- {name: ResponsibilitySeparation, description: 획득은 config-time, 소비는 runtime — gateway run이 enroll을 시도하지 않고 creds만 읽는가, weight: 0.9}
- {name: RoutingIsolation, description: account별 inbound가 바인딩된 agent에만 도달하고 타 account로 누수되지 않는가, weight: 0.9}
- {name: GracefulDegradation, description: 한 account의 creds 부재/오설정이 런타임·타 account·타 채널을 죽이지 않고 actionable 로그로 격리되는가, weight: 0.85}
- {name: WireCompatibility, description: NATS subject·register 라우트·SaaS/client 와이어가 무변경 유지되는가, weight: 0.8}
- {name: DeterministicConfigPrecedence, description: config 존재 시 acquisition env를 결정론적으로 무시하고 wrong-tenant 풋건을 구조적으로 제거하는가, weight: 0.75}
- {name: BackwardCompatibility, description: legacy 단일 creds와 flat config가 'default' account로 자연스럽게 fallback되는가, weight: 0.6}
exit_conditions:
- {name: AcquisitionMoved, criteria: 'AC1+AC2 충족 — gateway run에 enroll 코드 없음, 비대화형 channels add(user_code STDOUT/log→폴링→SaaS /approve) exit 0'}
- {name: MultiAccountServing, criteria: 'AC3+AC6 충족 — 멀티플렉스 서빙 + bind 라우팅 격리 2-account e2e PASS'}
- {name: RegressionGreen, criteria: 'AC5+AC7 충족 — config 우선 결정론, 기존 5개 하니스 회귀 GREEN, SaaS/client 와이어 무변경, run-all-real.sh가 channels-add-enroll 흐름으로 마이그레이션됨'}
