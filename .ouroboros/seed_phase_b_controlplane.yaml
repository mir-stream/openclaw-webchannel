goal: "WebChannel E2E NATS relay의 Phase B 제어평면을 구축한다 — 신규 in-repo packages/saas(재사용 가능한 headless 신뢰체인 코어 + reference/harness: setupTrustChain 키생성·NATS operator/account JWT+resolver emit·RFC 8628 device-flow enrollment·NATS user creds 발급·JWKS/bootstrap 발행)를 더하고, plugin/client 배선을 고쳐 살아있는 browser↔agent 채널을 gateway-WS에서 NATS로 완전히 전환(다중 피어 세션 라우팅은 bootstrap JWT sub로 보존)하며, 분산 NATS account/subject 권한과 에이전트측 cnf/PoP 검증으로 익명 open-admission 홀을 제거하고 승인을 NATS 위에서 first-write-wins exactly-once로 재확립한다. Phase A(data plane)는 brownfield로 보존·wiring하며 real nats-server interop + real-HTTP device-flow E2E + Phase A 테스트 보존으로 검증한다."
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: packages/plugin/src/nats-transport.ts
    role: primary
    summary: outbound 전용 NATS-WS 클라이언트(real nats-server 검증됨), A1 전환의 NATS 전송 기반
  - path: packages/plugin/src/crypto-nats-channel.ts
    role: primary
    summary: NatsTransport 위 E2E 암호화 채널(Phase A), A1 전환 시 live 경로가 가져다 쓸 콘텐츠 계층
  - path: packages/plugin/src/transport.ts
    role: primary
    summary: 현재 gateway-WS(noServer WSS) live 채널 경로 — A1 전환으로 제거 대상
  - path: packages/client/src/client.ts
    role: primary
    summary: 현재 gateway WS(/webchannel/ws) dial — A2 NATS 직접 dial로 전환 대상
  - path: packages/client/src/saas-bootstrap.ts
    role: primary
    summary: SaaS bootstrap 응답 파서(cnf/PoP, agentPublicKey 핀) — headless 코어 참조
  - path: packages/client/src/handshake-verifier.ts
    role: primary
    summary: bootstrap 기반 키 핀 검증 — C1 확장 기반
  - path: packages/plugin/src/jwt.ts
    role: primary
    summary: RS256+JWKS 검증 — cnf(C1) 처리 확장 대상
  - path: packages/plugin/src/approvals.ts
    role: primary
    summary: resolveApprovalOverGateway 봉합 — B2 NATS native 전환 대상
  - path: packages/plugin/src/nats-subject-permissions.test.ts
    role: reference
    summary: tenant-keyed nats.pub.allow/nats.sub.allow 모델 — B1이 real로 실현해야 할 권한 체계
constraints:
- "SaaS는 단일 신뢰 앵커이며 setupTrustChain은 bus 단위 offline 1회 root 단계(RS256 개인키 + NATS account signing seed 생성 → operator/account JWT + resolver + JWKS emit). account 키페어는 SaaS가 한 번 생성해 분할: private→SaaS 보관, public→NATS config, SaaS↔NATS 런타임 상호의존 없음"
- NATS 인증은 분산 operator/account JWT + resolver(정적 계정/앱 수준 아님), tenant account/subject 권한은 real nats-server가 강제(fake broker 아님)
- 에이전트(plugin)는 ingress-free이고 outbound dial만 수행; onboarding은 RFC 8628 device flow(plugin=신청자·SaaS/운영자=권한자)이며 비밀 붙여넣기가 어디에도 없다
- "Tenancy: plugin×1↔SaaS×1 친화, NATS account×1↔tenant×1 격리 단위, 승인은 tenant 스코프, setupTrustChain은 bus당 1회"
- SaaS는 신규 in-repo packages/saas — packages/client의 headless(src/) + example(index.html/vite/smoke) 분할 패턴을 미러하는 재사용 headless 코어 + reference/harness. 프로덕션 SaaS는 비목표(reference/harness only)
- Cutover(A1/A2)는 full replacement — NATS가 유일 채널 전송, gateway-WS relay 경로 제거, gateway는 plugin 호스팅만, dual-path/fallback 없음
- 다중 피어 세션 라우팅은 보존 — peerId 출처가 gateway-WS ticket/JWT에서 SaaS bootstrap JWT sub로 이동하고 세션 맵 키(peerId)는 불변
- C5는 익명 open-admission 홀 제거만 수행; admission은 B1(NATS account/subject perms) + C1(cnf 검증) + 키핀(#3/#4)으로 닫는다. 실제 allowlist/revocation 엔진과 키 로테이션은 deferred(revocation=enrollment 엔드포인트 재호출로 흡수)
- TypeScript ESM npm-workspaces 모노레포(packages/client, packages/plugin + 신규 packages/saas)와 Vitest를 유지한다
- Phase A data plane(X25519+HKDF-SHA256+ChaCha20-Poly1305 E2E crypto, NATS transport, envelopes, multi-device, late-join, approvals 콘텐츠, typing)은 brownfield — 재구현 않고 wiring한다
acceptance_criteria:
- SaaS setupTrustChain이 offline 1회로 RS256 키페어 + NATS account signing seed를 생성해 operator/account JWT + resolver config + JWKS를 emit하고, 그 config를 적재한 real nats-server가 tenant account/subject 권한을 강제한다(신뢰 루트 + NATS 설정이 실제 nats-server를 구동)
- plugin이 ingress-free로 첫 부팅해 RFC 8628 device flow로 등록(/enroll→user_code+device_code, verification_uri_complete, /poll)하고 운영자의 1회 승인으로 NATS user creds를 수령하며 자기 X25519 공개키를 SaaS에 등록한 뒤 로컬 영속하고, 재시작 시 재페어링 없이 NATS에 재연결한다(비밀 붙여넣기 없는 온보딩이 creds + 등록된 에이전트키를 산출)
- SaaS 발급 NATS user JWT/creds + resolver가 각 tenant/peer에게 자기 subject만 pub/sub 하도록 허가하고, real nats-server가 타 tenant/타 subject 트래픽을 거부한다(fake broker가 아닌 real 격리 입증)
- 에이전트가 browser 디바이스 키를 SaaS 서명 bootstrap JWT의 cnf 클레임으로 검증하고 익명 open-admission 경로를 제거하여 SaaS-attested 키만 허용·미검증 키는 hard deny한다(admission이 키-attested, open 홀 없음)
- 살아있는 browser↔agent 채널(채팅 + 승인 콘텐츠)이 NATS 위에서 동작한다 — browser가 NATS를 직접 dial하고 에이전트가 송수신하며 다중 피어 세션이 bootstrap JWT sub로 라우팅되고, 승인은 approvalId first-write-wins exactly-once로 NATS 위에서 native 재확립되며 gateway-WS relay 경로는 제거된다
- real-HTTP device-flow E2E(reference SaaS가 /enroll+/poll+/bootstrap을 serve; plugin + real nats-server + 테스트 운영자가 등록→승인→creds→연결→E2E 메시지 왕복을 완료)가 통과하고 Phase A의 기존 테스트가 모두 그대로 통과한다
ontology_schema:
  name: WebChannel Control-Plane Trust Model
  description: 단일 SaaS 신뢰 앵커 아래 분산 NATS 인증·RFC 8628 device-flow onboarding·에이전트측 cnf/PoP 검증으로 구성되는 제어평면 도메인 모델 — 신원/키 진위와 tenant 격리는 SaaS+NATS account로 닫고, 살아있는 채널은 gateway-WS에서 NATS로 전환된다.
  fields:
  - name: saasTrustChain
    type: object
    description: SaaS offline 1회 root 산출물 — RS256 키페어 + NATS account signing seed + emit된 operator/account JWT/resolver/JWKS, SaaS가 단일 신뢰 앵커
  - name: natsAccountConfig
    type: object
    description: operator/account JWT(공개) + resolver config, real nats-server가 적재해 tenant account/subject 권한 부여
  - name: deviceFlowEnrollment
    type: object
    description: RFC 8628 — user_code + device_code + verification_uri_complete, plugin 신청 → 운영자 1클릭 승인 → NATS user creds 발급
  - name: agentIdentityKey
    type: object
    description: plugin의 X25519 신원 키쌍, #3 페어링 시 공개키를 SaaS에 등록(#4 키핀 재료), 재시작 시 영속 로드
  - name: natsUserCreds
    type: object
    description: SaaS 발급 NATS user JWT/creds, tenant account/subject 권한 부여, plugin이 디스크 영속
  - name: bootstrapJwt
    type: object
    description: SaaS 발급 RS256 JWT — sub(peerId)/agentId/tenant + cnf.jwk(디바이스 공개키), browser가 agentPublicKey와 함께 핀
  - name: peerId
    type: string
    description: bootstrap JWT sub 기반 세션 라우팅 키, gateway-WS ticket/JWT → JWT sub로 출처 이동, 세션 맵 키 불변
  - name: admissionDecision
    type: object
    description: cnf/PoP 검증 + 키핀 결과, 익명 open-admission 제거, SaaS-attested 키만 허용·나머지 hard deny
  - name: approvalOverNats
    type: object
    description: approvalId 상관관계 first-write-wins exactly-once, gateway 위임에서 NATS native로 재확립
  - name: referenceSaasHarness
    type: object
    description: headless 코어를 운용하는 reference HTTP app + setupTrustChain CLI + smoke, 프로덕션 SaaS 비목표
evaluation_principles:
- name: SingleTrustAnchor
  weight: 1.0
  description: SaaS가 단일 신뢰 앵커, setupTrustChain offline 1회, account 키페어 분할, SaaS↔NATS 런타임 상호의존 없음
- name: RealNatsIsolation
  weight: 0.9
  description: tenant account/subject 권한이 real nats-server(resolver+account JWT)에서 강제되고 fake broker로 입증되지 않는다
- name: ZeroSecretPasteOnboarding
  weight: 0.9
  description: RFC 8628 device flow, 운영자 1클릭 승인, 비밀 붙여넣기 없음, 재시작 시 재페어링 없음
- name: FullCutoverNoFallback
  weight: 0.85
  description: NATS가 유일 채널 전송, gateway-WS 제거, 다중 피어 라우팅 보존, dual-path 없음
- name: AttestedAdmission
  weight: 0.85
  description: cnf/PoP + 키핀으로 SaaS-attested 키만 허용하고 익명 open 홀을 제거한다
- name: ExactlyOnceOverNats
  weight: 0.8
  description: approval first-write-wins exactly-once가 NATS 위에서 native로 재확립된다
- name: BrownfieldFidelity
  weight: 0.75
  description: Phase A 모듈·596 테스트를 보존하고 E2E crypto/transport는 재구현 않고 wiring한다
exit_conditions:
- name: AllAcceptanceCriteriaMet
  description: 6개 outcome-level 성공 기준이 모두 자동화 테스트로 검증됨
  criteria: 6개 outcome-level 성공 기준이 모두 자동화 테스트로 검증됨
- name: RealNatsInteropVerified
  description: real nats-server(resolver + account/subject JWT) 상호운용과 real-HTTP device-flow E2E가 통과함
  criteria: real nats-server(resolver + account/subject JWT) 상호운용과 real-HTTP device-flow E2E가 통과함
- name: PhaseARegressionFree
  description: Phase A의 기존 테스트가 변경 없이 그대로 통과함
  criteria: Phase A의 기존 테스트가 변경 없이 그대로 통과함
- name: DeferredItemsDocumented
  description: allowlist/revocation 엔진, 키 로테이션, 프로덕션 SaaS가 deferred로 명시됨
  criteria: allowlist/revocation 엔진, 키 로테이션, 프로덕션 SaaS가 deferred로 명시됨
