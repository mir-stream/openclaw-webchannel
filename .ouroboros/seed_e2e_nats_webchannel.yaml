goal: openclaw-webchannel에서 에이전트측 ingress를 제거하고 browser↔agent 트래픽을 공용 untrusted NATS(WebSocket) 버스로 라우팅하며, 모든 대화/승인 콘텐츠를 X25519+HKDF-SHA256+ChaCha20-Poly1305로 E2E 암호화하여 어떤 릴레이 운영자도 콘텐츠 평문을 못 읽게 하고, SaaS를 단일 신뢰 앵커로 browser↔agent·agent↔device 신원/키 진위를 양방향 대칭으로 닫는다.
task_type: code
brownfield_context:
  project_type: brownfield
constraints:
- 에이전트는 inbound ingress 포트를 열지 않고 outbound로만 NATS에 연결한다
- NATS 운영자 및 모든 중간 인프라는 콘텐츠 암호문만 관찰하고 콘텐츠 평문 접근 불가, 브라우저와 에이전트만 평문 당사자(라우팅 메타데이터는 평문 허용)
- 신뢰 앵커는 단일 SaaS — JWKS(RS256) 인가 및 에이전트/디바이스 공개키 진위 검증 모두 SaaS 경로, 키는 NATS로 전달되지 않음
- TypeScript ESM npm-workspaces 모노레포(packages/client, packages/plugin), Vitest 유지 및 _AssertDecisionInSync protocol/decision 미러링 가드 유지
- 콘텐츠 기밀성만 목표 — subject 이름/트래픽 메타데이터(agentId/tenant/sub)는 평문 노출 허용, linkability 은닉 비목표
- 버스 레벨 격리는 NATS account/subject permission으로 강제하고 SaaS JWT claim(agentId/tenant)을 신뢰 입력으로 사용
- JWT sub(엔드유저 신원)는 멀티디바이스 동기화를 위해 유저별 안정적·영속적이어야 한다
- 에이전트가 대화 히스토리·세션·승인 결정의 단일 권위 저장소이며 백로그 리플레이는 에이전트의 outbound publish로만 수행
- at-rest 저장은 평문이 아니라 E2E 암호문 엔벨로프(디바이스 키로만 복호)
- 그룹키 wrap 분배는 동일 sub 디바이스 집합 한정, 다른 유저에게 wrap되지 않음
- 전체 백로그 late-join 정책상 메시지 단위 forward secrecy는 포기(동일 유저 디바이스 집합 한정)
- 디바이스 등록은 SaaS cnf 클레임 바인딩 + PoP 통과를 전제로만 대화키 wrap 대상이 되며 JWT 검증 통과만으로는 불충분
- exactly-once decision 보장 — 하나의 approvalId에 대해 정확히 한 번만 확정하고 늦게 도착한 상충 응답은 에이전트가 멱등 처리한다
acceptance_criteria:
- 에이전트 서버가 inbound ingress 없이 outbound 전용으로 NATS에 연결되어, 포트 스캔에서 listening inbound 포트가 0개이며 outbound 연결만으로 응답 publish와 백로그 리플레이 왕복이 성공한다
- 콘텐츠 평문은 X25519+HKDF-SHA256+ChaCha20-Poly1305 E2E 암호문 엔벨로프로만 전송·at-rest 저장되어, 전송·저장 페이로드를 캡처해도 평문 콘텐츠 필드가 0개이고 릴레이 운영자/중간 인프라는 콘텐츠 평문에 접근 불가하다(agentId/tenant/sub 라우팅 메타데이터는 평문 허용)
- agent 상호작용 이전에 SaaS 발급 JWT가 JWKS(RS256)로 인가 검증되고, NATS account/subject permission으로 각 테넌트/유저가 자기 subject만 pub/sub 하도록 버스 레벨에서 격리된다
- 브라우저가 SaaS bootstrap만으로 에이전트 및 디바이스 공개키 진위를 검증하여(cnf/PoP 바인딩 + 공개키 핀, NATS 불신뢰) 버스 레벨 MITM/키 치환에 저항하며, NATS가 위조 에이전트/디바이스 공개키를 주입하면 SaaS 핀/cnf 불일치로 핸드셰이크가 거부된다
- 동일 JWT sub의 여러 디바이스/탭이 같은 대화를 1:N 브로드캐스트로 동기화하며, 신규/재연결(late-join) 디바이스가 load_history before/limit 페이지네이션으로 전체 과거 암호문을 wrap된 대화키로 빠짐없이(누락 0) 복호·열람한다
- 기존 chat 플로우가 X25519 ECDH+HKDF-SHA256+ChaCha20-Poly1305 E2E 암호문 엔벨로프로 새 NATS-WebSocket 트랜스포트 위에서 동작하고, 타이핑 인디케이터는 저장·리플레이 대상에서 제외된 ephemeral client↔client 라이브 신호로 분리되어 동작한다
- human-in-the-loop 승인의 요청/결정 콘텐츠가 E2E 암호문으로 전달되고, 모든 디바이스로 브로드캐스트되며, 에이전트가 단일 중재자로 first-write-wins exactly-once 확정 후 approval_resolved를 유저의 모든 구독 디바이스로 fan-out한다
ontology_schema:
  name: E2E NATS WebChannel Transport Model
  description: 공용 untrusted NATS 버스 위에서 ingress 없는 에이전트와 멀티디바이스 브라우저 간 E2E 암호화 대화·승인을 라우팅하는 도메인 모델 — 신원/키 진위는 SaaS 단일 앵커, 권위 저장소는 에이전트.
  fields:
  - name: peerId
    type: string
    description: JWT sub 기반 유저/대화 스코프 신원, 유저별 안정적·영속적, 암호 신원 운반체 아님
  - name: saasJwt
    type: object
    description: SaaS 발급 JWT — sub/tenant/agentId 인가·신원 클레임 및 디바이스키 바인딩(cnfClaim 참조)을 담는 토큰, JWKS(RS256) 검증 대상
  - name: agentIdentityKey
    type: object
    description: 에이전트의 공개키(X25519/Ed25519), SaaS가 attest·핀하여 브라우저가 검증하는 에이전트 암호 신원 — 디바이스 키와 대칭
  - name: deviceKeyPair
    type: object
    description: 디바이스별 X25519 키쌍, 암호 경계의 최소 단위이자 암호 신원 운반체
  - name: deviceRegistration
    type: object
    description: SaaS cnf 바인딩 + PoP 검증 상태 레코드, conversationKey wrap 적격을 게이트하는 디바이스 등록
  - name: conversationKey
    type: object
    description: 에이전트가 보유·생성하는 유저별 대칭 대화키, 진위 검증된 디바이스 공개키로 wrap되어 분배
  - name: natsSubject
    type: string
    description: agentId/tenant/sub가 평문 노출되는 account/permission 격리 대상 conversation subject
  - name: cnfClaim
    type: object
    description: SaaS가 JWT에 바인딩·서명한 디바이스 공개키 confirmation claim(RFC7800 스타일), cnf의 단일 출처
  - name: messageEnvelope
    type: object
    description: Inbound/Outbound discriminated-union 엔벨로프를 운반하는 E2E 암호문 페이로드(at-rest 저장 동일 형태)
  - name: approvalDecision
    type: object
    description: approvalId 상관관계를 갖는 승인 요청/결정/resolved, 콘텐츠는 E2E 암호문, 에이전트 first-write-wins exactly-once 중재
  - name: approvalId
    type: string
    description: 승인 요청의 상관관계 고유 키, exactly-once 확정의 uniqueness 기준
  - name: historyBacklog
    type: object
    description: 에이전트 권위 저장소의 암호문 히스토리, load_history/history before·limit 페이지네이션으로 리플레이
  - name: typingSignal
    type: boolean
    description: 영속 불요한 ephemeral client↔client 라이브 전용 신호
evaluation_principles:
- name: ZeroPlaintextLeak
  weight: 1.0
  description: 릴레이 운영자/중간 인프라 및 at-rest 저장 어디서도 콘텐츠 평문이 노출되지 않는다
- name: SaaSAnchoredAuthenticity
  weight: 0.9
  description: browser↔agent·agent↔device 키 진위가 단일 SaaS 앵커로 검증되고 NATS 신뢰 없이 키 치환/MITM에 저항한다
- name: IngressFreeAgent
  weight: 0.9
  description: 에이전트가 inbound 포트 없이 outbound 전용으로 모든 응답·백로그 리플레이를 수행한다
- name: ExactlyOnceApproval
  weight: 0.85
  description: fan-out 환경에서 하나의 approvalId가 first-write-wins로 정확히 한 번 확정되고 상충 응답이 멱등 처리된다
- name: MultiDeviceConsistency
  weight: 0.8
  description: 동일 sub의 모든 디바이스가 대화·백로그·resolved 상태를 일관되게 동기화한다
- name: BrownfieldFidelity
  weight: 0.75
  description: 기존 엔벨로프 타입·protocol 미러링 가드·JWKS 인가 레이어를 보존하며 점진 이행한다
exit_conditions:
- name: AllAcceptanceCriteriaMet
  description: 7개 outcome-level 성공 기준(일부는 밀접 관련 결과를 의도적으로 번들)이 모두 테스트로 검증됨
  criteria: 7개 outcome-level 성공 기준(일부는 밀접 관련 결과를 의도적으로 번들)이 모두 테스트로 검증됨
- name: E2ECryptoVerified
  description: X25519+HKDF-SHA256+ChaCha20-Poly1305 + 디바이스 키 wrap·cnf/PoP 바인딩 + 에이전트 키 핀 통합 테스트 검증
  criteria: X25519+HKDF-SHA256+ChaCha20-Poly1305 + 디바이스 키 wrap·cnf/PoP 바인딩 + 에이전트 키 핀 통합 테스트 검증
- name: ApprovalIdempotencyProven
  description: exactly-once decision이 동시 상충 응답 시나리오 테스트로 입증됨
  criteria: exactly-once decision이 동시 상충 응답 시나리오 테스트로 입증됨
